services:
  - type: web
    name: sequence-multiplayer
    runtime: node
    plan: free
    rootDir: sequence-server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGINS
        value: https://plane747-8.github.io
